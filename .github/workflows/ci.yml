name: ci

on:
  push:
    branches: [main, 001-multi-agent-support]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ruff check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests ruff check src tests scripts
      - name: ruff format --check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests ruff format --check src tests scripts
      - name: mypy
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests mypy

  tests:
    name: tests (pytest + no-stubs + traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pytest suite (rede isolada)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests pytest --maxfail=1
      - name: no stubs em src/ (constitution V)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests pytest tests/test_no_stubs.py tests/test_readme.py
      - name: rastreabilidade REQ → task → teste
        # Bloqueante: todo REQ marcado como entregue precisa de pelo menos um teste
        # associado (@pytest.mark.req). Falhar aqui vira defeito de rastreabilidade,
        # nao item informativo.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm tests python scripts/check_traceability.py

  web-lint:
    name: web-lint (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: web-lint
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-lint

  web-tests:
    name: web-tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vitest
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-tests

  web-build:
    name: web-build (vite production bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vite build
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-build

  compose-build:
    name: compose-build (todos os serviços)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        # Garante que todas as imagens (api, web, ingest, tests, k6, …) sobem num clone zero.
        # Pega regressões como o node_modules indo pro build context do web (item 1).
        run: docker compose build
      - name: OTLP vazio sem obs; Tempo só com docker-compose.obs.yml
        # Interpolação real do compose: sem o override a api não exporta spans.
        run: |
          base=$(docker compose config --format json \
            | jq -r '.services.api.environment.OTEL_EXPORTER_OTLP_ENDPOINT')
          obs=$(docker compose -f docker-compose.yml -f docker-compose.obs.yml --profile obs \
            config --format json | jq -r '.services.api.environment.OTEL_EXPORTER_OTLP_ENDPOINT')
          echo "sem obs: '${base}'  com obs: '${obs}'"
          test -z "${base}"
          test "${obs}" = "http://tempo:4318"

  web-e2e:
    name: web-e2e (playwright + mailpit, rede isolada)
    runs-on: ubuntu-latest
    # pgvector exige senha superuser para inicializar o volume vazio do CI; o compose
    # não traz default (prod recebe via .env). Sem isso, postgres sai com exit 1 e
    # derruba web → web-e2e. A senha é gerada no passo "materializar .env" e exportada em
    # $GITHUB_ENV, efêmera, só dentro deste job.
    steps:
      - uses: actions/checkout@v4
      # ingest/api carregam Settings no boot; jwt_secret é obrigatório (>= 32 bytes).
      # As envs do job só chegam ao shell que invoca o compose; o compose só propaga
      # para os containers o que estiver em .env ou expandido no YAML. Materializamos
      # um .env efêmero com dummies longos (>= 32 bytes) só para o container subir.
      - name: materializar .env efêmero para o compose
        run: |
          # Segredos gerados a cada execução: nenhum valor fixo no repositório.
          PG="$(openssl rand -hex 24)"
          JWT="$(openssl rand -hex 32)"
          SES="$(openssl rand -hex 32)"
          PEP="$(openssl rand -hex 32)"
          E2E="$(openssl rand -hex 16)"
          for v in "$PG" "$JWT" "$SES" "$PEP" "$E2E"; do echo "::add-mask::$v"; done
          echo "POSTGRES_PASSWORD=$PG" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$E2E" >> "$GITHUB_ENV"
          cat > .env <<EOF
          POSTGRES_PASSWORD=$PG
          JWT_SECRET=$JWT
          SESSION_SECRET=$SES
          PASSWORD_PEPPER=$PEP
          OPENAI_API_KEY=
          SMTP_URL=smtp://mailpit:1025
          WEB_BASE_URL=http://web
          EOF
      - name: playwright e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm web-e2e
      - name: api sem profile obs não tenta exportar spans
        # A stack acima subiu com `docker compose` sem obs e atendeu o e2e inteiro (spans
        # criados em todo request). Nenhum aviso do exporter OTLP pode aparecer no log da api.
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs api > api.log
          wc -l api.log
          grep -q '"event": "request"' api.log  # a api atendeu requests (spans foram criados)
          if grep -Ei 'failed to export|exporting span|transient error|otlp' api.log; then
            echo "::error::a api tentou exportar spans sem o profile obs"; exit 1
          fi
      - name: DIAG-SSE (temporário) linha do tempo do HITL quando o e2e falha
        if: failure()
        run: |
          dc="docker compose -f docker-compose.yml -f docker-compose.test.yml"
          echo "--- api: canal SSE e rotas do HITL"
          $dc logs --no-color --timestamps api \
            | grep -E 'diag_sse|/v1/(chat|conversations|handoffs)' | tail -120 || true
          echo "--- web (nginx): /v1"
          $dc logs --no-color --timestamps web | grep -E '/v1/' | tail -80 || true
          echo "--- playwright error-context"
          cat apps/web/test-results/*/error-context.md || true

  # Nota: a11y (axe-core) já roda dentro do web-e2e pelo spec `01-register-login` —
  # não precisa de job separado.

  secrets:
    name: gitleaks (histórico completo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: lock (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - name: uv lock está em dia
        run: uv lock --check

  trivy-fs:
    name: trivy (fs scan — SPA + raiz)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # SPA: deps do package-lock vs CVEs conhecidos.
      # Pinamos por SHA (nao por tag) para que o CI nao pegue uma retag silenciosa.
      # Decisao do time (PR #43, 2026-11-06): exit-code=0 neste scan porque as deps
      # HIGH/CRITICAL restantes (vite, vitest, tinypool, playwright, launch-editor, zod)
      # sao de BUILD/TEST e NAO entram no bundle nginx de producao. Os majors que
      # resolveriam (vite 8, vitest 5, zod 4) tem breaking changes e ficam no backlog.
      # O SARIF segue sendo enviado para a aba Security (visibilidade); o scan raiz
      # abaixo mantem exit-code=1 e bloqueia HIGH/CRITICAL em runtime (python+docker).
      - name: trivy fs apps/web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/web
          format: sarif
          output: trivy-web.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
      # Raiz: pyproject + uv.lock + Dockerfiles.
      # Dois steps: o primeiro imprime a tabela de CVEs no log (visibilidade);
      # o segundo gera o SARIF e falha o job. Sem o step de tabela, o SARIF-only
      # saia com exit 1 sem imprimir qual CVE disparou o bloqueio.
      - name: trivy fs raiz — tabela (diagnóstico)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: apps/web,node_modules
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
      - name: trivy fs raiz (python + docker)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: apps/web,node_modules
          format: sarif
          output: trivy-root.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          trivyignores: .trivyignore.yaml
      # Upload separado por scan, com category distinta: o CodeQL Action v3 nao aceita
      # mais varios SARIF runs sob a mesma category num unico upload (mudanca 2025-07-21).
      - name: upload sarif (web)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web
      - name: upload sarif (root)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-root.sarif
          category: trivy-root
