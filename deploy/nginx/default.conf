# Single-origin proxy: /v1/* goes to the API, everything else serves the SPA.
# Running on port 80 as a non-root user (see apps/web/Dockerfile).

# The API address is resolved per request, not once at start-up: recreating the api container
# (for example when the `obs` profile is brought up) gives it a new IP, and a static upstream kept
# sending traffic to the old one until nginx restarted (502 on the whole UI, QA-001). The
# resolver line is written at container start from /etc/resolv.conf, so it works with Docker
# (127.0.0.11) and Podman (aardvark on the network gateway); see apps/web/nginx-resolver.sh.
include /tmp/nginx-resolver.conf;

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;

  set $api http://api:8000;

  # Security headers for every response. nginx drops server-level add_header in any location that
  # declares its own add_header, so no location below uses add_header (QA-029..QA-035): caching
  # goes through `expires`, content type through `default_type`.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # The /metrics endpoint of the API stays on an internal port (9100); never proxy here.
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Server-Sent Events: never buffer or compress.
  location ~ ^/v1/(chat/stream|conversations/.+/events)$ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_read_timeout 30m;
  }

  # API proxy (everything under /v1/).
  location /v1/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA: hashed assets get a long cache (Cache-Control: max-age=31536000); HTML stays fresh
  # (expires -1 → Cache-Control: no-cache).
  location /assets/ {
    root /usr/share/nginx/html;
    expires 1y;
  }
  location /brand/ {
    root /usr/share/nginx/html;
    expires 7d;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
