groups:
  - name: getnet.sli
    interval: 30s
    rules:
      - alert: HighRequestLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(getnet_chat_turn_duration_seconds_bucket[5m])) by (le)
          ) > 8
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "p95 de /v1/chat > 8 s por 10 min"
          description: "Latência além do SLO; investigar circuito LLM, retrieval e tools."

      - alert: ToolErrorRateHigh
        expr: |
          sum(rate(getnet_tool_errors_total[5m]))
          / clamp_min(sum(rate(getnet_route_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Erro de tools > 5% da taxa de turnos"
          description: "Falha persistente em uma tool. Verificar circuit breaker e dependências."

      - alert: GuardrailBlockSpike
        expr: sum(rate(getnet_guardrail_blocks_total[5m])) > 1
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Pico de bloqueios de guardrail"
          description: "Pode indicar campanha de injeção ou regressão de prompt."

      - alert: OnlineEvalScoreLow
        # Média de 1 h do juiz online (faithfulness / relevance) abaixo de 0,7. O `and` exige
        # ao menos 5 turnos avaliados na janela, para uma amostra pequena não disparar sozinha.
        expr: |
          (
            sum by (metric) (rate(getnet_online_eval_score_sum[1h]))
            / sum by (metric) (rate(getnet_online_eval_score_count[1h]))
          ) < 0.7
          and sum by (metric) (increase(getnet_online_eval_score_count[1h])) >= 5
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Qualidade observada caiu: {{ $labels.metric }} médio < 0,7 em 1 h"
          description: "Juiz online (getnet_online_eval_score) abaixo do limiar. Comparar prompt.version nos spans llm.* e rodar o golden set."

      - alert: HandoffsQueueGrowing
        expr: increase(getnet_handoffs_total[15m]) > 5
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Fila de handoff crescendo rápido"
          description: "Mais de 5 novos tickets em 15 min; o SLA pode ser violado."

