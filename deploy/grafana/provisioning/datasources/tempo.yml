apiVersion: 1

# Traces da api (OTLP → Tempo). O `trace_id` devolvido por POST /v1/chat abre a árvore de spans
# no dashboard "Getnet - Trace" (uid getnet-trace) ou em Explore → Tempo.
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
